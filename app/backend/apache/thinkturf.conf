# Apache + mod_wsgi config for the ThinkTurf backend (the "A" in LAMP).
# Install mod_wsgi for the project's Python: `pip install mod_wsgi` then
# `mod_wsgi-express module-config` for the exact LoadModule line, or use
# your distro's libapache2-mod-wsgi-py3 package.
#
# Usage: copy/symlink into Apache's sites-available and `a2ensite thinkturf`.

<VirtualHost *:80>
    ServerName thinkturf.example.com

    WSGIDaemonProcess thinkturf python-home=/opt/thinkturf/venv python-path=/opt/thinkturf/backend
    WSGIProcessGroup thinkturf
    WSGIScriptAlias / /opt/thinkturf/backend/config/wsgi.py

    <Directory /opt/thinkturf/backend/config>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    Alias /static/ /opt/thinkturf/backend/staticfiles/
    <Directory /opt/thinkturf/backend/staticfiles>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/thinkturf-error.log
    CustomLog ${APACHE_LOG_DIR}/thinkturf-access.log combined
</VirtualHost>
